<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="A family concert library: 87 full shows, all in 4K."></head><body style="margin:0"><title>Mills Concert Hall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Figtree:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: Spotify-style shell (sidebar on desktop, bottom tabs + mini player on phones) holding YouTube-style video cards,
   Spotify track lists for genres, and a YouTube watch page. Musical details: vinyl in a sleeve, equalizer bars, "Last played" bar.
   Dark-only by choice: it's a screening room. Every control is at least 48px; text scales with the three A buttons. */
:root{
  --bg:#09090b; --panel:#121216; --card:#1b1b21; --card-h:#26262e; --line:rgba(255,255,255,.1);
  --ink:#f6f4f1; --muted:#b7b4bf; --amber:#ffb547; --amber-ink:#1d1203; --ok:#8fe388; --warn:#ff9a8a;
  --display:"Big Shoulders Display","Impact","Arial Narrow",sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --tabh:0px; --nowh:0px;
  color-scheme:dark; font-size:17px;
}
:root[data-size="2"]{font-size:19px}
:root[data-size="3"]{font-size:21.5px}
:root.hasnow{--nowh:4.9rem}
@media (max-width:899px){:root{--tabh:calc(4.5rem + env(safe-area-inset-bottom,0px))}}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--body);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button,a,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:1.45em;height:1.45em;flex:none;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ico.fill{fill:currentColor;stroke:none}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.pad{padding-left:1.6rem;padding-right:max(1.6rem,env(safe-area-inset-right,0px))}}

/* equalizer */
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:.95em;flex:none}
.eq i{width:3px;height:100%;border-radius:1px;background:currentColor;transform-origin:bottom;transform:scaleY(.45)}
.eq i:nth-child(2){transform:scaleY(.95)}.eq i:nth-child(3){transform:scaleY(.6)}.eq i:nth-child(4){transform:scaleY(.8)}
@media (prefers-reduced-motion:no-preference){
  .eq.live i{animation:eq .9s ease-in-out infinite alternate}
  .eq.live i:nth-child(2){animation-duration:.62s}.eq.live i:nth-child(3){animation-duration:1.15s;animation-delay:-.4s}.eq.live i:nth-child(4){animation-duration:.8s;animation-delay:-.2s}
  .vinyl.spin{animation:spin 5.5s linear infinite}
}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(1turn)}}

/* vinyl */
.vwrap{position:absolute;display:block}
.vinyl{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle,#0a0a0a 0 2.6%,var(--lc,#f6f4f1) 2.9% 29%,#0a0a0a 29.5% 31%,transparent 31.5%),repeating-radial-gradient(circle,#111 0 1.4px,#1c1c1f 1.4px 2.8px);
  box-shadow:0 12px 30px rgba(0,0,0,.6),inset 0 0 0 2px #26262a}
.vinyl b{font-family:var(--display);font-weight:900;font-size:1.25rem;color:rgba(0,0,0,.62);transform:translateY(-1.05em);letter-spacing:.04em}
.vwrap::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 30deg,transparent 0 9%,rgba(255,255,255,.14) 13%,transparent 19% 55%,rgba(255,255,255,.09) 60%,transparent 66%)}

/* artwork layers */
.art{position:absolute;inset:0;display:block;background:radial-gradient(120% 90% at var(--x,20%) -10%,var(--c1) 0%,transparent 55%),radial-gradient(90% 80% at 110% 110%,var(--c2) 0%,transparent 60%),linear-gradient(var(--a,135deg),#0c0b12,#17131f)}
.art::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from var(--r,200deg) at var(--x,20%) -20%,rgba(255,255,255,.08) 0deg 3deg,transparent 3deg 14deg);-webkit-mask-image:linear-gradient(180deg,#000,transparent 75%);mask-image:linear-gradient(180deg,#000,transparent 75%)}
.thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.aname{position:absolute;left:.7rem;right:4.4rem;bottom:.55rem;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:1.55rem;line-height:.92;text-shadow:0 2px 12px rgba(0,0,0,.5);overflow-wrap:anywhere}

/* shell */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100dvh}
.side{display:none}
.mainwrap{min-width:0;background:var(--panel)}
@media (min-width:900px){
  .app{grid-template-columns:16rem minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:.5rem;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px) - var(--nowh) - env(safe-area-inset-bottom,0px));overflow:auto;padding:.5rem .5rem .5rem max(.5rem,env(safe-area-inset-left,0px))}
  .mainwrap{margin:.5rem max(.5rem,env(safe-area-inset-right,0px)) 0 0;border-radius:12px 12px 0 0;overflow:clip}
  .tabbar,.hide-d{display:none!important}
}
@media (max-width:899px){.hide-m{display:none!important}}
.sbox{background:var(--panel);border-radius:12px;padding:.6rem;display:grid;gap:.15rem;align-content:start}
.sbox.grow{flex:1}
.slabel{font-weight:800;color:var(--muted);padding:.4rem .6rem;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:.85rem;min-height:50px;padding:0 .7rem;border-radius:8px;border:0;background:none;color:var(--muted);font-weight:800;font-size:1.02rem;cursor:pointer;width:100%;text-align:left}
.nav:hover,.nav[aria-current="page"]{color:var(--ink)}
.nav[aria-current="page"]{background:var(--card)}
.sadd{margin-top:.4rem;display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:50px;border-radius:999px;border:0;background:var(--ink);color:#000;font-weight:800;cursor:pointer}
.sgen{display:grid;grid-template-columns:3rem minmax(0,1fr);gap:.75rem;align-items:center;width:100%;min-height:3.8rem;padding:.4rem;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left}
.sgen:hover{background:var(--card)}.sgen[aria-current="page"]{background:var(--card-h)}
.sgen b{display:block;font-size:.95rem;line-height:1.2}.sgen small{display:block;font-size:.82rem;color:var(--muted)}
.gcov{position:relative;display:block;width:3rem;height:3rem;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,var(--h0),var(--h1))}
.gcov .vwrap{width:72%;height:72%;right:-22%;bottom:-22%}
.gcov .vinyl b{display:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:.7rem;padding-block:.65rem;background:rgba(18,18,22,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.logo{display:flex;align-items:center;gap:.55rem;margin-right:auto;padding:.3rem 0;border:0;background:none;cursor:pointer;text-align:left;color:var(--ink);font-family:var(--display);font-weight:900;font-size:1.5rem;line-height:1;letter-spacing:.04em;text-transform:uppercase}
.logo .eq{color:var(--amber);height:1.05em}
.logo small{font-family:var(--body);font-weight:800;font-size:.68rem;letter-spacing:.1em;padding:.22rem .4rem;border-radius:5px;background:var(--amber);color:var(--amber-ink)}
.side .logo{padding:.5rem .6rem .9rem;margin:0}
.top .logo{display:flex;font-size:1.22rem;gap:.45rem;min-width:0}
.top .logo small{display:none}
@media (max-width:899px){.top{gap:.5rem}.sizer button{min-width:44px;padding:0 .4rem}}
@media (min-width:900px){.top .logo{display:none}}
.tsearch{position:relative;display:none;flex:0 1 30rem;margin-right:auto}
@media (min-width:900px){.tsearch{display:block}}
.tsearch input,.msearch input{width:100%;min-height:52px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:.6rem 1rem .6rem 3.1rem;font-size:1.05rem;font-weight:600}
.tsearch input:focus,.msearch input:focus{outline:none;border-color:var(--ink);background:var(--card-h)}
.tsearch .ico,.msearch .ico{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--muted);width:1.25rem;height:1.25rem}
.sizer{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.sizer button{min-height:48px;min-width:46px;border:0;background:var(--card);font-weight:800;cursor:pointer;padding:0 .55rem}
.sizer button+button{border-left:1px solid var(--line)}
.sizer button[aria-pressed="true"]{background:var(--ink);color:#000}
.tbtn{min-height:48px;padding:0 1rem;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem}
.tbtn:hover{background:var(--card-h)}

/* tab bar + now playing */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;height:var(--tabh);display:flex;justify-content:space-around;align-items:stretch;padding:.3rem max(6px,env(safe-area-inset-right,0px)) calc(.3rem + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));background:rgba(9,9,11,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:grid;place-items:center;align-content:center;gap:.1rem;border:0;background:none;color:var(--muted);font-weight:800;font-size:.8rem;cursor:pointer;border-radius:12px;min-width:0}
.tabbar button .ico{width:1.65rem;height:1.65rem}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] .ico{color:var(--amber)}
.nowbar{position:fixed;z-index:7;bottom:calc(var(--tabh) + .4rem);left:max(.5rem,env(safe-area-inset-left,0px));right:max(.5rem,env(safe-area-inset-right,0px));height:4.5rem;display:flex;align-items:center;gap:.7rem;padding:.4rem .5rem .4rem .45rem;border-radius:12px;background:linear-gradient(90deg,color-mix(in srgb,var(--c,#444) 55%,#17171c),#17171c 75%);box-shadow:0 10px 30px rgba(0,0,0,.6)}
@media (min-width:900px){.nowbar{left:0;right:0;bottom:0;border-radius:0;height:calc(4.9rem + env(safe-area-inset-bottom,0px));padding:.5rem max(1rem,env(safe-area-inset-right,0px)) calc(.5rem + env(safe-area-inset-bottom,0px)) max(1rem,env(safe-area-inset-left,0px));box-shadow:none;border-top:1px solid var(--line)}}
.nb-main{flex:1;min-width:0;display:flex;align-items:center;gap:.7rem;border:0;background:none;padding:0;cursor:pointer;text-align:left;min-height:3.5rem}
.nbthumb{position:relative;display:block;width:5.6rem;aspect-ratio:16/9;border-radius:6px;overflow:hidden;flex:none}
.nbtxt{min-width:0;display:grid}
.nbtxt small{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.nbtxt b,.nbtxt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbtxt span{font-size:.9rem;color:var(--muted)}
.nowbar>.eq{color:var(--amber);height:1.3rem}
.nbplay{flex:none;display:inline-flex;align-items:center;gap:.4rem;min-height:48px;min-width:48px;justify-content:center;padding:0 1rem;border-radius:999px;border:0;background:var(--ink);color:#000;font-weight:800;text-decoration:none;cursor:pointer}
@media (max-width:420px){.nbplay span{display:none}.nbplay{padding:0}.nbthumb{width:4.6rem}}

/* views */
#view{padding-bottom:calc(var(--tabh) + var(--nowh) + env(safe-area-inset-bottom,0px) + 2.5rem);min-height:60vh}
.v-home,.v-genre,.v-watched{background:linear-gradient(180deg,color-mix(in srgb,var(--hc,#444) 30%,transparent),transparent 24rem)}
.greet{font-size:1.85rem;font-weight:900;letter-spacing:-.015em;margin:0;padding-top:1.3rem;line-height:1.15}
.stat{margin:.2rem 0 1.1rem;color:var(--muted);font-weight:600}
.qp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
:root[data-size="3"] .qp{grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.qp,:root[data-size="3"] .qp{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1100px){.qp,:root[data-size="3"] .qp{grid-template-columns:repeat(4,minmax(0,1fr))}}
.qpi{position:relative;display:grid;grid-template-columns:var(--qth,4.2rem) minmax(0,1fr) auto;align-items:center;gap:.7rem;min-height:4.2rem;padding:0 .7rem 0 0;border:0;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.09);cursor:pointer;text-align:left;transition:background .15s}
.qpi:hover{background:rgba(255,255,255,.17)}
.qth{position:relative;display:block;width:var(--qth,4.2rem);height:100%;min-height:4.2rem;overflow:hidden}
.qpi b{overflow-wrap:anywhere;hyphens:auto;font-size:.98rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qpi .eq{color:var(--amber)}
@media (max-width:699px){.qp{--qth:3.3rem}.qpi{gap:.55rem;padding-right:.45rem;min-height:3.6rem}.qth{min-height:3.6rem}.qpi b{font-size:.9rem}}

.feature{position:relative;display:grid;gap:1.4rem;align-items:center;margin-top:1.8rem;padding:1.3rem;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 26%,var(--card)),var(--card) 62%)}
@media (min-width:700px){.feature{grid-template-columns:minmax(0,14rem) minmax(0,1fr);column-gap:7.5rem;padding:1.7rem}}
.disc{position:relative;width:min(58%,14rem);aspect-ratio:1}
@media (min-width:700px){.disc{width:100%}}
.sleeve{position:absolute;inset:0;z-index:2;display:block;border-radius:6px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.65)}
.sleeve::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.14),transparent 40%)}
.disc .vwrap{inset:3%;z-index:1;transform:translateX(44%)}
.fk{display:flex;align-items:center;gap:.55rem;font-size:.85rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.feature h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(2.6rem,7vw,4.6rem);line-height:.9;margin:.35rem 0 .3rem;text-wrap:balance;overflow-wrap:anywhere}
.ft{font-size:1.2rem;font-weight:700;margin:0 0 .5rem}
.meta{display:flex;flex-wrap:wrap;gap:.3rem .9rem;color:var(--muted);font-size:.95rem;align-items:center}
.acts{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:52px;padding:0 1.2rem;border-radius:999px;border:0;background:var(--card-h);color:var(--ink);font-weight:800;font-size:1rem;cursor:pointer;text-decoration:none;text-align:center}
.pill:hover{filter:brightness(1.15)}
.pill.amber{background:var(--amber);color:var(--amber-ink);box-shadow:0 8px 24px -8px rgba(255,181,71,.65)}
.pill.on{background:var(--ok);color:#0b2a0a}
.q4k{font-size:.72rem;font-weight:900;letter-spacing:.08em;padding:.18rem .42rem;border-radius:5px;background:var(--ink);color:#000}

.shh{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin:2.3rem 0 .9rem}
.shh h2{margin:0;font-size:1.45rem;font-weight:900;letter-spacing:-.01em;display:flex;align-items:center;gap:.6rem;line-height:1.2}
.shh h2 .eq{color:var(--c,var(--amber))}
.showall{min-height:48px;padding:0 .5rem;border:0;background:none;color:var(--muted);font-weight:800;cursor:pointer;white-space:nowrap}
.showall:hover{color:var(--ink);text-decoration:underline}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
:root[data-size="3"] .tiles{grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.tiles,:root[data-size="3"] .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1100px){.tiles,:root[data-size="3"] .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.gtile{position:relative;isolation:isolate;overflow:hidden;min-height:6.6rem;padding:.9rem;border:0;border-radius:12px;cursor:pointer;text-align:left;color:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;background:linear-gradient(135deg,var(--h0),var(--h1))}
.gtile::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,rgba(0,0,0,.25),rgba(0,0,0,0) 60%)}
.gtile b{font-size:1.1rem;font-weight:900;line-height:1.15;max-width:72%;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.gtile small{font-size:.85rem;font-weight:700;opacity:.92}
.gtile .vwrap{width:5.4rem;height:5.4rem;right:-1.4rem;bottom:-1.4rem;transform:rotate(25deg);transition:transform .3s}
.gtile:hover .vwrap{transform:rotate(25deg) translate(-.3rem,-.3rem)}
.gtile .vinyl b{display:none}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4rem .8rem}
:root[data-size="3"] .cards{grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.cards,:root[data-size="3"] .cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1100px){.cards,:root[data-size="3"] .cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{display:grid;gap:.4rem;align-content:start;min-width:0;padding:0;border:0;background:none;color:var(--ink);text-align:left;cursor:pointer}
.vthumb{position:relative;isolation:isolate;display:block;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--card);margin-bottom:.25rem;transition:border-radius .2s}
.vcard:hover .vthumb{border-radius:6px}
.dur{position:absolute;right:.4rem;bottom:.4rem;z-index:2;padding:.08rem .38rem;border-radius:4px;background:rgba(0,0,0,.82);font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;color:#fff}
.k4{position:absolute;left:.4rem;top:.4rem;z-index:2;padding:.08rem .38rem;border-radius:4px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.35);font-size:.7rem;font-weight:900;letter-spacing:.06em;color:#fff}
.wbar{position:absolute;left:0;right:0;bottom:0;z-index:2;height:4px;background:var(--amber)}
.pc{position:absolute;inset:0;margin:auto;z-index:2;width:3.4rem;height:3.4rem;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;box-shadow:0 8px 22px rgba(0,0,0,.55)}
.pc .ico{margin-left:.2rem}
@media (hover:hover){.vcard:hover .pc{opacity:1;transform:none}}
.va{font-weight:800;font-size:1.03rem;line-height:1.25;overflow-wrap:anywhere}
.vt{font-size:.95rem;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vs{font-size:.85rem;color:var(--muted)}

/* playlist header + track list */
.phead{display:grid;gap:1.1rem;align-items:end;padding:1.6rem 0 1rem}
@media (min-width:700px){.phead{grid-template-columns:12rem minmax(0,1fr);gap:1.6rem}}
.pcov{position:relative;isolation:isolate;overflow:hidden;width:min(12rem,52%);aspect-ratio:1;border-radius:8px;background:linear-gradient(135deg,var(--h0),var(--h1));box-shadow:0 18px 44px rgba(0,0,0,.55)}
@media (min-width:700px){.pcov{width:100%}}
.pcov .vwrap{width:66%;height:66%;right:-14%;bottom:-14%}
.pcov .vinyl b{display:none}
.pcname{position:absolute;left:.8rem;top:.7rem;right:.8rem;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:2.1rem;line-height:.9;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.kick{font-size:.85rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.phead h1,.pageh{font-size:clamp(2.1rem,6.5vw,4.2rem);font-weight:900;line-height:1;letter-spacing:-.025em;margin:.2rem 0 .5rem;text-wrap:balance}
.pageh{padding-top:1.3rem;font-size:2rem}
.psub{margin:0;color:var(--muted);font-weight:600}

  <div class="pact"><button class="shuf" type="button" data-shuffle="${k}"><span class="bigc">${I.shuffle}</span>Pick one for me</button></div>${trackList(list)}`}
function watchedHTML(){const list=sorted(rows.filter(r=>seen.has(r.id)));$("view").style.setProperty("--hc","#ffb547");
  return `<section class="phead"><div class="pcov" style="--h0:#d98a14;--h1:#5b21b6">${vinyl("#f6f4f1","",false)}<span class="pcname">Watched</span></div>
    <div><div class="kick">Your list</div><h1>Watched</h1><p class="psub">${list.length?`${list.length} show${list.length===1?"":"s"} you've played on this device`:"Shows you play will appear here."}</p></div></section>
  ${list.length?trackList(list):`<div class="empty"><b>Nothing here yet</b><span>Tap any show and press Play. It will be saved here so you can find it again.</span><button class="pill amber" type="button" data-go="home">Find a show</button></div>`}`}
const matches=r=>{const t=term.trim().toLowerCase();return [r.artist,r.title,r.venue,r.year,G[r.genre]?.n].join(" ").toLowerCase().includes(t)};
function renderSearch(){const v=$("view");
  if(v.dataset.v!=="search"||!$("results")){v.style.removeProperty("--hc");
    v.innerHTML=`<h1 class="pageh">Search</h1><label class="msearch" for="q2"><span class="vh">Search concerts</span>${I.search}<input id="q2" class="qinput" type="search" placeholder="A band, a song, a city…" autocomplete="off" value="${esc(term)}"></label><div id="results"></div>`}
  updateResults()}
function updateResults(){const box=$("results");if(!box)return;const t=term.trim();
  if(!t){box.innerHTML=`<div class="shh"><h2>Browse all</h2></div>${tiles()}`;return}
  const list=sorted(rows.filter(matches));
  box.innerHTML=`<div class="shh"><h2>${list.length?`${list.length} result${list.length===1?"":"s"} for “${esc(t)}”`:`Nothing found for “${esc(t)}”`}</h2></div>`+(list.length?trackList(list):`<div class="empty"><b>No shows match that</b><span>Check the spelling, or try just the band's name.</span></div>`)}
function render(){
  buildSide();const v=$("view");
  if(!rows.length){v.className="pad";v.dataset.v="";v.innerHTML=db===false?`<div class="empty"><b>Sign in to enter the hall</b><span>The lineup is shared with family signed in to claude.ai.</span></div>`:`<div class="loading">${EQ(true)}Opening the doors…</div>`;markCurrent();return}
  if(view==="genre"&&!G[genre])view="home";
  v.className="pad v-"+view;
  if(view==="search")renderSearch();else v.innerHTML=view==="genre"?genreHTML(genre):view==="watched"?watchedHTML():homeHTML();
  v.dataset.v=view;markCurrent();updateNowbar()}
function go(v,g){view=v;genre=g||null;render();window.scrollTo(0,0);
  if(v==="search"){const i=$("q2");if(i&&getComputedStyle(i.parentElement).display!=="none")i.focus();else $("q").focus()}}

/* now playing */
function updateNowbar(){const r=last&&rows.find(x=>x.id===last),nb=$("nowbar");
  if(!r){nb.hidden=true;document.documentElement.classList.remove("hasnow");return}
  nb.hidden=false;document.documentElement.classList.add("hasnow");nb.style.setProperty("--c",(G[r.genre]||G.rock).h[0]);
  nb.innerHTML=`<button class="nb-main" type="button" data-id="${esc(r.id)}"><span class="nbthumb">${art(r,"sm")}</span><span class="nbtxt"><small>${nowLive?"Now playing":"Last played"}</small><b>${esc(r.artist)}</b><span>${esc(r.title)}</span></span></button>${EQ(nowLive)}${STATIC?`<button class="nbplay" type="button" data-playnow="${esc(r.id)}">${I.play}<span>Play</span></button>`:`<a class="nbplay" href="${esc(ytUrl(r))}" target="_blank" rel="noopener" data-watch="${esc(r.id)}">${I.play}<span>Play</span></a>`}`}
function markPlayed(id,live){seen.add(id);ls.set("mch.seen",[...seen]);last=id;ls.set("mch.last",id);nowLive=!!live;
  const p=document.querySelector("#watch [data-seen]");if(p){p.classList.add("on");p.textContent="✓ Watched"}updateNowbar()}

/* watch page */
const fact=(k,v)=>v?`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`:"";
function watchHTML(r){const g=G[r.genre]||G.rock,s=srcOf(r),canDel=!STATIC&&!!db&&(isOwner||(myId&&r.addedBy===myId&&!BASE.some(b=>b.id===r.id)));
  const list=byGenre(r.genre),idx=list.findIndex(x=>x.id===r.id),next=[];
  for(let i=1;i<list.length&&next.length<6;i++)next.push(list[(idx+i)%list.length]);
  for(const x of sorted(rows))if(next.length<6&&x.id!==r.id&&!next.includes(x))next.push(x);
  const big=STATIC?`<button class="bigp" type="button" data-embed="${esc(r.id)}" aria-label="Play ${esc(r.artist)}">${I.play}</button><span class="pcap">Tap to play</span>`
    :`<a class="bigp" href="${esc(ytUrl(r))}" target="_blank" rel="noopener" data-watch="${esc(r.id)}" aria-label="Play ${esc(r.artist)} on YouTube">${I.play}</a><span class="pcap">Plays on YouTube in 4K</span>`;
  return `<div class="wtop pad"><button class="back" type="button" data-closewatch>${I.back}Back</button><span class="logo">${EQ(nowLive)}<span class="hide-m">Mills Concert Hall</span></span></div>
  <div class="wgrid pad"><div>
    <div class="pbox">${art(r,"lg")}${big}</div>
    <div class="wtitle"><h1>${esc(r.artist)}</h1><p>${esc(r.title)}</p></div>
    <div class="chips"><span class="chip k">4K</span><button class="chip" type="button" data-g="${g.k}">${esc(g.n)}</button><span class="chip ${s}">${esc(SRC[s])}</span>${r.dur?`<span class="chip">${esc(niceLen(r.dur))}</span>`:""}</div>
    <div class="wact">${STATIC?`<button class="pill amber" type="button" data-embed="${esc(r.id)}">${I.play}Play here</button><a class="pill" href="${esc(ytUrl(r))}" target="_blank" rel="noopener" data-watch="${esc(r.id)}">${I.tv}Open in YouTube for the TV</a>`:`<a class="pill amber" href="${esc(ytUrl(r))}" target="_blank" rel="noopener" data-watch="${esc(r.id)}">${I.play}Play in 4K</a>`}
      <button class="pill${seen.has(r.id)?" on":""}" type="button" data-seen="${esc(r.id)}">${seen.has(r.id)?"✓ Watched":"Mark as watched"}</button>
      <button class="pill" type="button" data-copy="${esc(r.id)}">${I.link}Copy link</button></div>
    <div class="desc"><h2>About this show</h2>${r.note?`<p>${esc(r.note)}</p>`:""}
      <dl class="facts">${fact("Where",r.venue)}${fact("Year",r.year)}${fact("Length",niceLen(r.dur))}${fact("Filmed by",SRC_WHO[s])}</dl>
      <p class="muted">${esc(SRC_LONG[s])}</p></div>
    ${STATIC?`<div class="lbl">Scenes from the show</div><div class="stills">${[1,2,3].map(n=>`<img src="${yimg(r,"hq"+n)}" alt="Scene ${n} from ${esc(r.artist)}" loading="lazy">`).join("")}</div>`:""}
    <div class="tip"><span><b>Looks blurry?</b> In YouTube, tap the gear ⚙ and choose <b>2160p</b>. It can take a few seconds to sharpen.</span></div>
    ${canDel?`<button class="lnk" type="button" data-del="${esc(r.id)}">Remove from the hall</button>`:""}
  </div>
  <aside class="upnext" aria-label="Up next"><h2>Up next</h2>${next.map(x=>`<button class="unrow" type="button" data-id="${esc(x.id)}"><span class="unthumb">${art(x,"sm")}${x.dur?`<span class="dur">${esc(x.dur)}</span>`:""}</span><span><b>${esc(x.artist)}</b><small>${esc(x.title)}</small><small>${esc(SRC[srcOf(x)])}</small></span></button>`).join("")}</aside></div>`}
let savedY=0;
function openWatch(id,auto){const r=rows.find(x=>x.id===id);if(!r)return;const w=$("watch"),first=w.hidden;
  if(first){lastFocus=document.activeElement;savedY=window.scrollY}armDel=false;nowLive=false;
  try{if(first)history.pushState({watch:id},"");else history.replaceState({watch:id},"")}catch{}
  w.innerHTML=watchHTML(r);w.hidden=false;document.documentElement.classList.add("watching");window.scrollTo(0,0);
  if(auto&&STATIC)embed(id);else w.querySelector(".back").focus({preventScroll:true})}
function embed(id){const r=rows.find(x=>x.id===id),pb=document.querySelector("#watch .pbox");if(!r||!pb)return;
  pb.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(r.vid)}?autoplay=1&rel=0&playsinline=1" title="${esc(r.artist+": "+r.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  markPlayed(id,true);const e=document.querySelector("#watch .wtop .eq");if(e)e.classList.add("live")}
function closeWatch(skip){const w=$("watch");if(w.hidden)return;w.hidden=true;w.innerHTML="";document.documentElement.classList.remove("watching");nowLive=false;
  if(skip){try{if(history.state&&history.state.watch)history.replaceState(null,"")}catch{}}
  if(!skip){render();window.scrollTo(0,savedY);if(lastFocus&&document.contains(lastFocus))lastFocus.focus({preventScroll:true});}}
function leaveWatch(){if(history.state&&history.state.watch){history.back()}else closeWatch()}
addEventListener("popstate",()=>{if(!$("watch").hidden)closeWatch()});

/* sheets */
function openSheet(html,label){$("scrim").innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><button class="close" type="button" data-close>✕ Close</button>${html}</div>`;$("scrim").hidden=false;setTimeout(()=>$("scrim").querySelector(".close")?.focus(),30)}
function closeSheet(){$("scrim").hidden=true;$("scrim").innerHTML=""}
function helpSheet(){openSheet(`<div class="sheet-in"><h3>How to watch on the TV</h3>
  <ol class="steps">
    <li><div><b>Pick a show</b><span>Tap any picture, then the gold <b>Play</b> button.</span></div></li>
    <li><div><b>Send it to the TV</b><span>In YouTube, tap the cast button (a small screen with curved lines) and choose your TV. The TV needs the YouTube app and the same Wi‑Fi.</span></div></li>
    <li><div><b>Make it sharp</b><span>If it looks soft, tap the gear ⚙ and choose <b>2160p</b>. 4K needs fast internet.</span></div></li>
    <li><div><b>Turn it up</b><span>Use the TV remote for volume. A soundbar makes a big difference for concerts.</span></div></li>
  </ol>

  <div class="tip" style="margin:0"><span><b>Official film</b> means the band or venue made it. <b>Filmed by a fan</b> means it was shot from the crowd.</span><span><b>Watched:</b> shows you play get a gold line under the picture and are saved in the Watched list.</span></div></div>`,"How to watch")}
function addSheet(){openSheet(`<div class="sheet-in"><h3>Add a 4K concert</h3>
  <p style="color:var(--muted)">Find the concert on YouTube, tap <b>Share</b>, then <b>Copy link</b>, and paste it below.</p>
  <form id="addForm" autocomplete="off" novalidate>
    <label for="aLink">YouTube link<input id="aLink" type="url" inputmode="url" placeholder="Paste the link here"></label>
    <div class="two">
      <label for="aArtist">Band or artist<input id="aArtist" type="text" maxlength="60"></label>
      <label for="aTitle">Name of the show<small>For example, “Live at Red Rocks”</small><input id="aTitle" type="text" maxlength="120"></label>
      <label for="aVenue">Where it was played<small>Optional</small><input id="aVenue" type="text" maxlength="80"></label>
      <label for="aYear">Year<small>Optional</small><input id="aYear" type="text" inputmode="numeric" maxlength="4"></label>
    </div>
    <label for="aGenre">Genre<select id="aGenre">${GENRES.map(g=>`<option value="${g.k}">${esc(g.n)}</option>`).join("")}</select></label>
    <fieldset><legend>Who filmed it?</legend>
      <label class="radio" for="sOff"><input type="radio" name="src" id="sOff" value="official" checked> The band or venue (official)</label>
      <label class="radio" for="sFan"><input type="radio" name="src" id="sFan" value="fan"> A fan in the crowd</label>
      <label class="radio" for="sRes"><input type="radio" name="src" id="sRes" value="restored"> An older show restored to 4K</label></fieldset>
    <label class="check" for="a4k"><input id="a4k" type="checkbox"> I checked the gear ⚙ menu on YouTube and it offers 2160p (4K)</label>
    <button class="pill amber" type="submit">Add to the hall</button>
    <div class="status" id="aStatus" role="status"></div>
  </form></div>`,"Add a concert")}
function vidFrom(s){s=String(s||"").trim();const m=s.match(/(?:youtu\.be\/|[?&]v=|\/live\/|\/shorts\/|\/embed\/)([A-Za-z0-9_-]{11})/);return m?m[1]:(/^[A-Za-z0-9_-]{11}$/.test(s)?s:null)}

/* events */
document.addEventListener("click",async e=>{const t=e.target,q=s=>t.closest(s);let el;
  if(el=q("[data-watch]")){markPlayed(el.dataset.watch,false);return}
  if(el=q("[data-playnow]")){openWatch(el.dataset.playnow,true);return}
  if(el=q("[data-embed]")){embed(el.dataset.embed);return}
  if(q("[data-closewatch]")){leaveWatch();return}
  if(el=q("[data-seen]")){const id=el.dataset.seen;seen.has(id)?seen.delete(id):seen.add(id);ls.set("mch.seen",[...seen]);el.classList.toggle("on",seen.has(id));el.textContent=seen.has(id)?"✓ Watched":"Mark as watched";return}
  if(el=q("[data-copy]")){const r=rows.find(x=>x.id===el.dataset.copy);const u=ytUrl(r);try{await navigator.clipboard.writeText(u);toast("Link copied. Paste it in a text or email.")}catch{toast("Here's the link: "+u)}return}
  if(el=q("[data-del]")){if(!armDel){armDel=true;el.textContent="Are you sure? Tap again to remove";el.classList.add("warn");return}
    try{const id=el.dataset.del,ref=db.doc("concerts/"+id);if(BASE.some(b=>b.id===id))await ref.set({vid:id,hidden:true,addedBy:myId||""});else await ref.delete();closeWatch();toast("Removed")}catch{el.textContent="Couldn't remove it. Only the person who added it can."}return}
  if(el=q("[data-shuffle]")){const k=el.dataset.shuffle,pool=k==="all"?rows:byGenre(k);if(pool.length)openWatch(pool[Math.floor(Math.random()*pool.length)].id);return}
  if(q("#shuffleHero")&&rows.length>1){const pool=rows.filter(r=>r.id!==heroId);heroId=pool[Math.floor(Math.random()*pool.length)].id;render();document.querySelector(".feature")?.scrollIntoView({block:"nearest",behavior:"smooth"});return}
  if(el=q("[data-g]")){closeWatch(true);go("genre",el.dataset.g);return}
  if(el=q("[data-go]")){closeWatch(true);go(el.dataset.go);return}
  if(el=q("[data-id]")){openWatch(el.dataset.id);return}
  if(q("[data-help]")){helpSheet();return}
  if(q("[data-add]")){addSheet();return}
  if(q("[data-close]")||t===$("scrim")){closeSheet();return}
});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("scrim").hidden)closeSheet();else if(!$("watch").hidden)leaveWatch()});
document.addEventListener("input",e=>{if(!e.target.classList?.contains("qinput"))return;term=e.target.value;document.querySelectorAll(".qinput").forEach(i=>{if(i!==e.target)i.value=term});
  if(view!=="search"){view="search";genre=null;render();e.target.focus()}else updateResults()});
let rt,lastCols=cols();addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{const c=cols();if(c!==lastCols){lastCols=c;if(view==="home")render()}},150)});
document.addEventListener("submit",async e=>{if(e.target.id!=="addForm")return;e.preventDefault();
  const st=$("aStatus");st.className="status err";
  if(!db){st.textContent="Sign in to claude.ai to add concerts.";return}
  const vid=vidFrom($("aLink").value);
  if(!vid){st.textContent="That link doesn't look right. In YouTube, tap Share, then Copy link, and paste it again.";$("aLink").focus();return}
  if(rows.some(r=>r.vid===vid)){st.textContent="Good news: that show is already in the hall.";return}
  const artist=$("aArtist").value.trim(),title=$("aTitle").value.trim();
  if(!artist){st.textContent="Please type the band or artist.";$("aArtist").focus();return}
  if(!title){st.textContent="Please give the show a name.";$("aTitle").focus();return}
  const year=$("aYear").value.trim();if(year&&!/^\d{4}$/.test(year)){st.textContent="The year needs four numbers, like 1994.";$("aYear").focus();return}
  if(!$("a4k").checked){st.textContent="This hall is 4K only. Check YouTube's gear ⚙ menu shows 2160p, then tick the box.";return}
  st.className="status";st.textContent="Adding…";
  try{await db.doc("concerts/"+vid).set({vid,artist,title,venue:$("aVenue").value.trim(),year,genre:$("aGenre").value,dur:"",src:document.querySelector('input[name="src"]:checked').value,note:"",addedBy:myId||"",addedAt:Date.now(),order:Date.now()});
    closeSheet();toast("Added "+artist+" to the hall")}
  catch(err){st.className="status err";st.textContent=err&&err.code==="permission_denied"?"You can watch but not add. Ask Brandon to give you edit access.":"Couldn't add it. Check your internet and try again."}});

const BASE=CATALOG.map(r=>({id:r.vid,...r}));
function merge(dbRows){const byId=new Map(BASE.map(r=>[r.id,r]));for(const d of dbRows){if(d.hidden)byId.delete(d.id);else if(d.vid)byId.set(d.id,{...byId.get(d.id),...d})}return [...byId.values()]}
(async()=>{
  rows=merge([]);
  if(STATIC){render();return}
  render();
  if(!window.claude?.use){render();return}
  [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(user){try{myId=await user.id();isOwner=await user.isOwner()}catch{}}
  if(!db){render();return}
  db.collection("concerts").onSnapshot(snap=>{rows=merge(snap.docs.map(d=>({id:d.id,...d.data()})));if($("watch").hidden)render();else{buildSide();updateNowbar()}},()=>{});
})();
</script>
</body></html>
